name: CI (fallback in deploy/)

# This is a fallback CI workflow stored in deploy/ (useful when .github can't be created).
# To enable GitHub Actions, copy this file to .github/workflows/ci.yml
on:
  push:
    branches: ["dev", "main"]
  pull_request:
    branches: ["dev", "main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.12]
    env:
      # Ensure pytest-django can find settings (conftest.py also sets a default).
      DJANGO_SETTINGS_MODULE: core.settings.dev
      PYTHONPATH: ${{ github.workspace }}/src

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Upgrade pip & build tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install dependencies (editable if available) and test/dev tools
        run: |
          set -e
          # If project is packaged (pyproject.toml or setup.py), install editable so imports work.
          if [ -f "pyproject.toml" ] || [ -f "setup.py" ]; then
            python -m pip install -e .
          fi
          # Install minimal test/dev deps needed for CI
          python -m pip install pytest pytest-django pytest-cov pytest-mock factory-boy ruff

      - name: Run lint and tests via Makefile (ci)
        run: |
          # Ensure src/ is discoverable for imports
          export PYTHONPATH="${GITHUB_WORKSPACE}/src:${PYTHONPATH}"
          # Optionally run migrations here if tests require DB state:
          # python src/manage.py migrate --noinput
          make ci

      - name: Run pytest with coverage (explicit)
        run: |
          export PYTHONPATH="${GITHUB_WORKSPACE}/src:${PYTHONPATH}"
          mkdir -p reports
          python -m pytest --maxfail=1 --disable-warnings --junitxml=reports/junit.xml --cov=src --cov-report=xml

      - name: Upload test reports artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            coverage.xml
            reports/junit.xml

      # Optional: upload coverage to Codecov (uncomment and set CODECOV_TOKEN in repo secrets)
      # - name: Upload coverage to Codecov
      #   uses: codecov/codecov-action@v4
      #   with:
      #     files: coverage.xml
      #     flags: unittests
