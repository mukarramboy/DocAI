[project]
name = "docai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "celery>=5.6.3",
    "django>=6.0.3",
    "django-cors-headers>=4.9.0",
    "djangorestframework>=3.16.1",
    "djangorestframework-simplejwt>=5.5.1",
    "google-genai>=1.69.0",
    "pillow>=12.1.1",
    "psycopg[binary]>=3.3.3",
    "redis>=7.4.0",
    "weaviate-client[agents]>=4.20.4",
]

[dependency-groups]
dev = [
    "django-stubs>=5.2.9",
    "factory-boy>=3.3.3",
    "flower>=2.0.1",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.12.0",
    "pytest-mock>=3.15.1",
    "pytest-xdist>=3.8.0",
]
